name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches Dockerfile's runtime

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: Byte-compile everything (catches syntax errors ruff won't)
        run: python -m compileall -q .

  docker-build:
    name: Docker build (mirror image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mirror image
        run: docker build -t telegram-channel-mirror:ci .
